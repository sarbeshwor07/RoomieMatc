services:
  - type: web
    name: roomiematch-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/database/migrate.js && node src/database/seed.js && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
